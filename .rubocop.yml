inherit_mode:
  merge:
    - Exclude

AllCops:
  TargetRubyVersion: 4.0.6
  Exclude:
    - 'test/fixtures/**/*'

Style/StringLiterals:
  EnforcedStyle: single_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# Tests embed sample RSpec and Minitest source, so their size says little about complexity.
Metrics/AbcSize:
  Exclude:
    - 'test/**/*'

Metrics/ClassLength:
  Exclude:
    - 'test/**/*'

Metrics/MethodLength:
  Exclude:
    - 'test/**/*'
